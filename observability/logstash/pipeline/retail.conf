# Logstash pipeline: pipeline events + database logs -> Elasticsearch.
#
# Two inputs on purpose. The ETL emits structured JSON, so its events need routing and enrichment
# rather than parsing. Postgres emits plain text, so those lines genuinely need grok. Real
# estates have both, and a pipeline that can only handle one of them ends up with half the
# platform's logs living somewhere else.

input {
  # Pipeline run events. The ETL writes JSON Lines; sincedb tracks position so a Logstash restart
  # resumes where it stopped instead of replaying the whole file and double-counting every metric.
  file {
    path => "/logs/pipeline-events.jsonl"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_pipeline"
    codec => json
    tags => ["pipeline_event"]
  }

  # Database logs, plain text, exactly as Postgres writes them.
  file {
    path => "/pglogs/*.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_postgres"
    tags => ["postgres_log"]
  }
}

filter {
  if "pipeline_event" in [tags] {
    mutate {
      add_field => { "[pipeline][source]" => "etl_events" }

      # Fields Logstash adds that the index template deliberately does not model:
      #
      # - event.original is a verbatim copy of the whole JSON line. Keeping it alongside the
      #   parsed fields doubles the index size to store the same information twice.
      # - @version and log.file are Logstash bookkeeping, not facts about the pipeline run.
      #
      # They must be removed rather than mapped, because the template is `dynamic: strict` —
      # which is the point. A strict mapping turns "an unexpected field appeared" into a loud
      # rejection instead of silently absorbing whatever a shipper decides to add, and that is
      # exactly the guarantee an operational index needs.
      remove_field => ["[event][original]", "@version", "[log][file]"]
    }

    # No date filter here. The JSON codec already parsed @timestamp out of the event body, so
    # re-parsing an object that is no longer a string just tags every document with
    # _dateparsefailure while changing nothing.
  }

  if "postgres_log" in [tags] {
    # Postgres' default log_line_prefix '%m [%p] ' plus level and message.
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:pg_timestamp} \[%{NUMBER:[database][pid]:int}\] %{WORD:[log][level]}:  %{GREEDYDATA:[log][message]}"
      }
      # A line that does not match is tagged rather than dropped. Silently discarding unparsed
      # lines is how a log pipeline ends up hiding the very errors it was built to surface.
      tag_on_failure => ["_grokparsefailure_postgres"]
    }

    date {
      match => ["pg_timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS z", "yyyy-MM-dd HH:mm:ss z"]
      remove_field => ["pg_timestamp"]
      tag_on_failure => ["_dateparsefailure_postgres"]
    }

    # Slow queries are the reason to ship database logs at all. Pulling the duration into a
    # numeric field is what makes "p95 statement time by hour" a Kibana aggregation rather than a
    # manual read of raw text.
    if [log][message] =~ /^duration:/ {
      grok {
        match => {
          "[log][message]" => "duration: %{NUMBER:[database][duration_ms]:float} ms\s+%{GREEDYDATA:[database][statement]}"
        }
        tag_on_failure => ["_grokparsefailure_duration"]
      }
    }

    mutate {
      add_field => {
        "[pipeline][source]" => "postgres"
        "[service][name]" => "retail-warehouse"
        "[event][dataset]" => "retail.database"
      }
      remove_field => ["[event][original]", "@version", "[log][file]"]
    }

    # The raw line is redundant once parsed, and keeping both doubles the index size for no extra
    # answer. Unparsed lines keep it, since there it is the only content there is.
    if "_grokparsefailure_postgres" not in [tags] {
      mutate { remove_field => ["message"] }
    }
  }

  # Applied to everything: ingest time is provenance, not decoration. Comparing it to @timestamp
  # gives shipping lag for free.
  ruby {
    code => "event.set('[pipeline][ingested_at]', Time.now.utc.iso8601(3))"
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]

    # Date-suffixed indices rather than one growing index: retention becomes dropping yesterday's
    # index instead of a delete-by-query that rewrites segments and fights the merge scheduler.
    index => "retail-pipeline-%{+YYYY.MM.dd}"

    # The index template owns the mappings, so Logstash must not install its own — its default
    # template would otherwise claim the same pattern and map every metric as text.
    manage_template => false
    action => "index"
  }

  # Parse failures are surfaced locally too. A tagged document nobody looks at is the same as a
  # dropped one.
  if "_grokparsefailure_postgres" in [tags] {
    stdout { codec => rubydebug { metadata => false } }
  }
}
